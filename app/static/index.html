<title>Century Command Centre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky green brand bar, left rail (scrolling tabs on phone), main = headline numbers -> charts -> what needs attention.
   Calendar = month grid with the Mon/Wed/Fri cadence slots + a day panel. Poppins is the brand fallback face and covers Hindi. */
:root{
  --bg:#f1f4ee; --surface:#ffffff; --ink:#13241a; --ink2:#4b5f53; --mute:#6f8176; --line:#dce4d9; --soft:#f6f8f4;
  --g:#136C37; --y:#FDB913; --on-g:#ffffff;
  --chart:#136C37; --chart-soft:rgba(19,108,55,.14);
  --jag:#B8740A; --soya:#136C37; --mak:#3F6FA8; --rng:#6d7d73;
  --ok-bg:#dcf1e3; --ok-fg:#0d5a2b; --wait-bg:#fdecc3; --wait-fg:#7a5200; --bad-bg:#f9dcd8; --bad-fg:#8e2418;
  --info-bg:#dfe9f6; --info-fg:#27507f; --draft-bg:#e8ece6; --draft-fg:#4b5f53;
  --shadow:0 1px 2px rgba(19,36,26,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1610; --surface:#15221a; --ink:#e7f0ea; --ink2:#a6b8ad; --mute:#869a8d; --line:#25382c; --soft:#101b14;
  --g:#1c8a49; --chart:#3aae69; --chart-soft:rgba(58,174,105,.18);
  --jag:#CF8A18; --soya:#2E9E5B; --mak:#5B8FD0; --rng:#8fa296;
  --ok-bg:#16402a; --ok-fg:#8fe0ae; --wait-bg:#4a3a10; --wait-fg:#f5cf70; --bad-bg:#4d1f1a; --bad-fg:#f5a79e;
  --info-bg:#1c3350; --info-fg:#a9c8ef; --draft-bg:#223329; --draft-fg:#a6b8ad; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1610; --surface:#15221a; --ink:#e7f0ea; --ink2:#a6b8ad; --mute:#869a8d; --line:#25382c; --soft:#101b14;
  --g:#1c8a49; --chart:#3aae69; --chart-soft:rgba(58,174,105,.18);
  --jag:#CF8A18; --soya:#2E9E5B; --mak:#5B8FD0; --rng:#8fa296;
  --ok-bg:#16402a; --ok-fg:#8fe0ae; --wait-bg:#4a3a10; --wait-fg:#f5cf70; --bad-bg:#4d1f1a; --bad-fg:#f5a79e;
  --info-bg:#1c3350; --info-fg:#a9c8ef; --draft-bg:#223329; --draft-fg:#a6b8ad; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--g);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--g);color:var(--on-g);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;letter-spacing:.2px}
.logo u{text-decoration:underline;text-decoration-color:var(--y);text-decoration-thickness:3px;text-underline-offset:4px}
.logo sup{font-size:10px;font-weight:500}
.phase{font-size:12px;opacity:.92;display:flex;gap:8px;align-items:center;min-width:0}
.phase b{background:var(--y);color:#1b1b1b;border-radius:99px;padding:1px 9px;font-weight:600}
.who{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;flex-wrap:wrap}
.who select{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:4px 8px;color:#fff}
.who select option{color:#13241a}
.pill-demo{background:var(--y);color:#1b1b1b;border-radius:99px;padding:1px 10px;font-weight:600}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;max-width:1280px;margin:0 auto;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));align-self:start}
nav.rail button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px;color:var(--ink2);cursor:pointer}
nav.rail button:hover{background:var(--soft)}
nav.rail button.on{background:var(--surface);color:var(--g);font-weight:600;box-shadow:var(--shadow);outline:1px solid var(--line)}
:root[data-theme="dark"] nav.rail button.on{color:var(--chart)}
nav.rail svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.rail .badge{margin-left:auto;background:var(--y);color:#1b1b1b;border-radius:99px;font-size:11px;font-weight:600;padding:0 7px}
main{min-width:0}
h2{font-size:20px;margin:0 0 4px;font-weight:600}
.sub{color:var(--ink2);margin:0 0 16px}
h3{font-size:13px;margin:0;font-weight:600;letter-spacing:.2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card>header{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.card>header small{color:var(--mute);font-size:12px}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.kpi .v{font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--ink2);font-size:12px}
.kpi .d{font-size:12px;color:var(--mute)}
.pillx{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.s-approved,.s-published,.s-published_dry_run,.s-auto_replied,.s-won,.s-resolved{background:var(--ok-bg);color:var(--ok-fg)}
.s-needs_md,.s-needs_qa,.s-needs_human,.s-escalated_qa,.s-escalated_md,.s-qualified,.s-contacted{background:var(--wait-bg);color:var(--wait-fg)}
.s-draft,.s-rejected,.s-lost,.s-hidden,.s-new{background:var(--draft-bg);color:var(--draft-fg)}
.s-rejected,.s-lost{background:var(--bad-bg);color:var(--bad-fg)}
.s-scheduled,.s-sample_sent{background:var(--info-bg);color:var(--info-fg)}
.pillx::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.s-scheduled::before{background:none;border:1.5px solid currentColor}
.s-needs_md::before,.s-needs_qa::before{border-radius:1px;transform:rotate(45deg)}
/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax text{fill:var(--mute);font-size:11px;font-family:inherit}
.grid-l{stroke:var(--line);stroke-width:1}
.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:12.5px}
.hb .t{color:var(--ink2);overflow-wrap:anywhere}
.hb .tr{background:var(--soft);border-radius:4px;height:14px;overflow:hidden;outline:1px solid var(--line)}
.hb .f{height:100%;border-radius:0 4px 4px 0;background:var(--chart);min-width:2px}
.hb .vl{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;min-width:3ch}
.mixbar{display:flex;gap:2px;height:26px;position:relative;margin-top:6px}
.mixbar>div{border-radius:4px;min-width:3px}
.mixlab{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--ink2)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tgt{position:absolute;top:-6px;bottom:-6px;width:0;border-left:2px dashed var(--ink)}
.tgtl{font-size:11px;color:var(--mute);position:absolute;top:-22px;transform:translateX(-50%);white-space:nowrap}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:260px;display:none}
/* attention list */
.att{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.att li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.att li button{margin-left:auto}
.att .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--y)}
.att .dot.bad{background:#d44a3a}
/* calendar */
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tools h3{font-size:16px;min-width:150px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--g);color:#fff;border-color:var(--g)}
.btn.sm{padding:2px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:0 0 10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--soft);padding:6px 8px;font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.cell{background:var(--surface);min-height:104px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;border:0;min-width:0;position:relative}
.cell:hover{background:var(--soft)}
.cell.out{background:var(--soft);color:var(--mute)}
.cell.sel{outline:2px solid var(--g);outline-offset:-2px;z-index:1}
.cell .dn{font-size:12px;font-weight:600;display:flex;gap:4px;align-items:center}
.cell.today .dn span:first-child{background:var(--g);color:#fff;border-radius:99px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.cell .key{font-size:10px;font-weight:600;color:var(--wait-fg);background:var(--wait-bg);border-radius:4px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:flex;align-items:center;gap:4px;border-radius:5px;padding:1px 5px;font-size:11px;line-height:1.35;border-left:3px solid var(--c);background:var(--soft);min-width:0}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip i{font-style:normal;font-size:9.5px;font-weight:700;margin-left:auto;flex:none;padding:0 4px;border-radius:3px}
.chip.st-needs_md,.chip.st-needs_qa{background:var(--wait-bg)}
.chip.st-draft,.chip.st-rejected{background:var(--draft-bg);border-left-style:dashed}
.chip.st-published,.chip.st-published_dry_run{background:var(--ok-bg)}
.slot{font-size:10.5px;color:var(--mute);border:1px dashed var(--line);border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel h3{font-size:15px}
.postcard{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px;margin-top:10px;background:var(--soft)}
.postcard p{margin:6px 0;color:var(--ink2);font-size:13px}
.issues{margin:6px 0 0;padding:0;list-style:none;font-size:12px}
.issues li.e{color:var(--bad-fg)} .issues li.w{color:var(--wait-fg)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
input[type=text],input[type=number],input[type=datetime-local],select.f,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea{min-height:92px;resize:vertical}
label.l{display:block;font-size:12px;color:var(--ink2);margin-bottom:3px}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.form .wide{grid-column:1/-1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:60;font-size:13px;max-width:90vw}
.note{background:var(--wait-bg);color:var(--wait-fg);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.login{max-width:360px;margin:60px auto}
.muted{color:var(--mute)} .err{color:var(--bad-fg)}
.funnel-n{font-weight:600}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.rail{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px}
  nav.rail button{white-space:nowrap}
  .calwrap{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .cell{min-height:64px;padding:3px}
  .chip span,.chip i,.slot,.cell .key{display:none}
  .chip{height:7px;padding:0}
  .cell .key{display:none}
  .cal .dow{padding:4px 2px;font-size:10px;text-align:center}
  .kpi .v{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ===== helpers ===== */
const h=(tag,a={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(a||{})){if(v==null||v===false)continue;
  if(k==='on')for(const[ev,f]of Object.entries(v))e.addEventListener(ev,f);else if(k==='class')e.className=v;
  else if(k==='style')e.setAttribute('style',v);else if(k in e&&k!=='list')e[k]=v;else e.setAttribute(k,v)}
  for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c instanceof Node?c:document.createTextNode(String(c)))}return e};
const $app=document.getElementById('app'),tip=document.getElementById('tip');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const inr=n=>n==null?'—':'₹'+Math.round(n).toLocaleString('en-IN');
const nf=n=>Math.round(n).toLocaleString('en-IN');
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const TODAY=iso(new Date());
const HERO_COL={jaggery:'var(--jag)',soya:'var(--soya)',makhana:'var(--mak)',brand:'var(--y)'};
const heroCol=p=>HERO_COL[(p||'').toLowerCase()]||'var(--rng)';
const HERO_LABEL={jaggery:'Jaggery',soya:'Soya',makhana:'Makhana',brand:'Brand',seasoning:'Seasoning',poha:'Poha',besan:'Besan',pulses:'Pulses'};
const statusLabel=s=>({needs_md:'Needs MD',needs_qa:'Needs QA',published_dry_run:'Published (dry run)',auto_replied:'Auto-replied',escalated_qa:'To QA',escalated_md:'To MD',needs_human:'Needs reply',sample_sent:'Sample sent'}[s]||s.replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()));
const pill=s=>h('span',{class:'pillx s-'+s},statusLabel(s));
let toastT;const toast=m=>{document.querySelector('.toast')?.remove();const t=h('div',{class:'toast',role:'status'},m);document.body.append(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3200)};
function showTip(ev,html){tip.innerHTML=html;tip.style.display='block';const r=tip.getBoundingClientRect();let x=ev.clientX+14,y=ev.clientY-r.height-10;
  if(x+r.width>innerWidth-8)x=ev.clientX-r.width-14;if(y<8)y=ev.clientY+16;tip.style.left=x+'px';tip.style.top=y+'px'}
const hideTip=()=>tip.style.display='none';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== phases & key dates (Brand Bible section 10) ===== */
const PHASES=[{n:0,name:'Build trust',from:'2026-10-21',to:'2026-11-05'},{n:1,name:'Hero launch',from:'2026-11-06',to:'2026-12-06'},{n:2,name:'Full range',from:'2026-12-07',to:'2027-01-31'}];
const phaseOf=s=>PHASES.find(p=>s>=p.from&&s<=p.to);
const KEYDATES={'2026-10-20':'Site live','2026-10-21':'Phase 0','2026-11-06':'Packs land','2026-11-08':'Diwali · paid starts','2026-12-07':'Phase 2','2027-01-13':'Lohri'};
const SLOT={0:['Mon','Jaggery reel','jaggery'],2:['Wed','Soya reel','soya'],4:['Fri','Makhana reel','makhana'],5:['Sat','Brand/range carousel','brand'],6:['Sun','Brand/range carousel','brand']};

/* ===== data layer: live API when reachable, otherwise labelled sample data ===== */
let MODE='boot',TOKEN='',ME={name:'',role:'viewer'},DATA=null;
try{TOKEN=sessionStorage.getItem('ctok')||''}catch(e){}
async function api(path,opt={}){
  const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:opt.body?JSON.stringify(opt.body):undefined});
  const ct=r.headers.get('content-type')||'';
  if(!ct.includes('json'))throw new Error('not-api');
  const j=await r.json();if(r.status===401)throw new Error('401');if(!r.ok)throw new Error(j.detail||r.statusText);return j}
const normPost=p=>{let f=p.flags;if(typeof f==='string'){try{f=JSON.parse(f)}catch(e){f={}}}
  const ts=p.scheduled_for||p.published_at||p.created_at;return{...p,flags:f||{},date:p.date||iso(new Date(ts*1000)),time:p.time||new Date(ts*1000).toTimeString().slice(0,5)}};
async function loadLive(){
  const [me,ov,posts,ser,msg,leads,calls,site,roi,gr]=await Promise.all([api('/api/me'),api('/api/overview'),api('/api/posts'),api('/api/series?days=30'),
    api('/api/messages'),api('/api/leads'),api('/api/calls'),api('/api/site'),api('/api/roi'),api('/api/growth')]);
  ME=me;return{ov,posts:posts.map(normPost),ser,msg,leads,calls,site,roi,gr}}

/* sample data: dates follow the Handbook calendar; captions use Handbook starters */
function sample(){
  const P=(id,date,time,hero,format,title,status,caption,flags={})=>({id,date,time,hero,format,title,status,caption,flags,hashtags:'#Century #PureHomeFood #CenturySince1980'});
  const posts=[
    P(1,'2026-10-21','13:00','brand','reel','B1 · 1980 se, ek hi vaada','approved','Long before wellness trends, there was home food: pure ingredients, honest choices. We have been making it since 1980.',{needs_md:false}),
    P(2,'2026-10-23','19:00','makhana','reel','M1 · 5 minute, 1 kadhai','approved','Healthy snacking, made at home with ingredients you trust. Your ghee. Your spices. Your snack.'),
    P(3,'2026-10-24','13:00','brand','carousel','B2 · What “Nothing less” means','needs_md','Pure home food. Nothing less. Here is what that promise looks like in practice.',{needs_md:true}),
    P(4,'2026-10-26','13:00','jaggery','reel','J5 · Gud wali chai phat gayi?','approved','The one jaggery-chai mistake almost everyone makes. Switch off the flame, let it settle, then stir in the jaggery.'),
    P(5,'2026-10-28','19:00','soya','reel','S3 · Soya rubbery lagta hai?','approved','Soft, juicy soya every time. Follow these 3 steps.'),
    P(6,'2026-10-30','13:00','brand','reel','B3 · Aapke khaane se pehle','needs_md','Every batch is checked before it carries our name. Take a look inside. 250+ quality checks on our pulses*.',{needs_md:true,warnings:['Keep the asterisk and do not explain the parameters without QA’s list']}),
    P(7,'2026-10-31','13:00','jaggery','carousel','J2 · Sugar vs jaggery: the honest version','needs_qa','Most brands won’t tell you this part. We will. Jaggery is still sugar; ours is a less-refined swap with no chemicals.',{needs_qa:true,warnings:['Check “less-refined” wording against the approved framing']}),
    P(8,'2026-11-02','13:00','jaggery','reel','J3 · 4 jagah, cheeni ki jagah gud','draft','Cheeni ki jagah gud, par kaise? Quick-dissolving, so it works in chai, coffee, shakes, oats and mithai.',{errors:['CTA “Buy now” not allowed until the MD sets a sales start date and prices'],warnings:['Missing brand hashtag #CenturySince1980']}),
    P(9,'2026-11-04','19:00','soya','reel','S1 · Paneer se zyada protein? Haan','approved','Vegetarian and chasing protein? 35% more protein than paneer*. *Basis on pack.'),

const redraws=[];
function niceMax(v){if(v<=0)return 4;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function lineChart(host,pts,o={}){
  const draw=()=>{const W=Math.max(host.clientWidth,260),H=o.h||220,m={l:46,r:14,t:14,b:26};
    const ys=pts.map(p=>p.y),mx=niceMax(Math.max(...ys,1)),n=pts.length,iw=W-m.l-m.r,ih=H-m.t-m.b;
    const X=i=>m.l+(n<2?0:i*iw/(n-1)),Y=v=>m.t+ih-(v/mx)*ih;
    const ticks=[0,1,2,3,4].map(k=>mx*k/4);
    const fmt=o.fmt||nf;
    const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');
    const area=line+`L${X(n-1).toFixed(1)} ${m.t+ih}L${X(0).toFixed(1)} ${m.t+ih}Z`;
    const step=Math.ceil(n/(W<420?4:7));
    let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Line chart')}"><g class="ax">`;
    ticks.forEach(t=>{s+=`<line class="grid-l" x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${m.l-8}" y="${Y(t)+4}" text-anchor="end">${fmt(t)}</text>`});
    pts.forEach((p,i)=>{if(i%step===0||i===n-1)s+=`<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${p.x}</text>`});
    s+=`</g>`;
    if(!o.noArea)s+=`<path d="${area}" fill="var(--chart-soft)"/>`;
    s+=`<path d="${line}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    (o.marks||[]).forEach(i=>{s+=`<circle cx="${X(i)}" cy="${Y(pts[i].y)}" r="4.5" fill="var(--surface)" stroke="var(--bad-fg)" stroke-width="2"/>`});
    s+=`<circle cx="${X(n-1)}" cy="${Y(pts[n-1].y)}" r="4" fill="var(--chart)" stroke="var(--surface)" stroke-width="2"/>`;
    s+=`<line id="cx" y1="${m.t}" y2="${m.t+ih}" stroke="var(--ink2)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>`;
    s+=`<circle id="cd" r="5" fill="var(--chart)" stroke="var(--surface)" stroke-width="2" style="display:none"/>`;
    s+=`<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/></svg>`;
    host.innerHTML=s;const svg=host.firstChild,cx=svg.querySelector('#cx'),cd=svg.querySelector('#cd');
    const move=ev=>{const r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)*(W/r.width);let i=Math.round((px-m.l)/(iw/(n-1||1)));i=Math.max(0,Math.min(n-1,i));
      cx.setAttribute('x1',X(i));cx.setAttribute('x2',X(i));cx.style.display='';cd.setAttribute('cx',X(i));cd.setAttribute('cy',Y(pts[i].y));cd.style.display='';
      showTip(ev,`<b>${esc(pts[i].full||pts[i].x)}</b><br>${esc(o.name||'Value')}: ${fmt(pts[i].y)}${o.extra?'<br>'+esc(o.extra(i)):''}`)};
    const hit=svg.querySelector('#hit');hit.addEventListener('pointermove',move);hit.addEventListener('pointerleave',()=>{cx.style.display=cd.style.display='none';hideTip()})};
  draw();redraws.push(draw)}
function hbars(host,rows,o={}){host.className='hb';host.replaceChildren();const mx=Math.max(...rows.map(r=>r.v),1);
  rows.forEach(r=>{const tr=h('div',{class:'tr'},h('div',{class:'f',style:`width:${(r.v/mx*100).toFixed(1)}%;${r.c?'background:'+r.c:''}`}));

    host.append(h('div',{class:'t'},r.t),tr,h('div',{class:'vl'},r.label??nf(r.v)))})}
